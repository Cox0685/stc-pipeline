name: Run STC Pipeline (TNS through GLD, REP, and Tables, scheduled)

# Runs the full ingestion + transform + reporting chain directly on a
# GitHub-hosted runner, on a schedule - no Azure RBAC/managed identity
# needed at all. Uses the same storage key auth already proven locally,
# plus the SafetyCulture API key, both as GitHub secrets (not baked into
# the code).
#
# This is a genuine stopgap, not the final architecture: no Log Analytics
# integration, no managed identity, secrets live in GitHub instead of Key
# Vault. It exists to get real automated runs happening today instead of
# waiting on the RBAC grant from IT. Once that comes through, the Container
# App Job (infra/main.bicep) is still the intended long-term home for this -
# migrate back to it then, rather than running two automation paths forever.
#
# SCOPE: now covers the full pipeline - TNS (raw) -> BNZ -> SLV -> GLD
# (bronze/silver/gold), then the reporting stage (REP, via the RP1/RP2/RP3
# scripts), then the final delivery stage (RP4, writing into TABLES - the
# ADLS equivalent of the local SHEQ Portal's assets/tables folder, the
# pipeline's actual delivery point for the front-end web app).
#
# STAGE ORDER: this matches STC Pipeline Runner.py's local stage order
# exactly. One thing worth flagging specifically: Date Scrape MUST run
# BEFORE Table Merge, not after - Date Scrape splits date+time columns in
# SLV; Table Merge copies SLV -> GLD. Run Table Merge first and GLD gets
# built from un-split SLV, and every "_time" column silently never makes
# it into GLD at all. The very first version of this workflow had these
# two steps the wrong way round - fixed here.
#
# Steps run in sequence and each depends on the previous one's output -
# GitHub Actions stops the job automatically if any step fails, so a bad
# run at any stage won't silently feed garbage into later stages.

on:
  workflow_dispatch:
    inputs:
      include_user_groups:
        description: 'Also pull User_Groups this run? (slow - can take 2.5+ hours with the current user count)'
        type: boolean
        default: false
      skip_ingestion_and_transform:
        description: 'Skip Stages 1-5 (SafetyCulture ingestion through GLD)? Use this to re-test the reporting stages against data already sitting in Azure from a previous run, without re-pulling everything and burning Actions minutes on it.'
        type: boolean
        default: false
  schedule:
    - cron: '0 2 * * 0-4,6' # Sun/Mon/Tue/Wed/Thu/Sat, 02:00 UTC - fast run, skips User_Groups
    - cron: '0 2 * * 5'     # Friday, 02:00 UTC - full run, includes User_Groups, longer timeout

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Job-level safety net: caps the ENTIRE run, all steps combined. 330 min
    # because the weekly (Friday) run pulls HeadsUp_Users + User_Groups in
    # Stage 1 (about 50 min + 2.5 hours) before the other stages even start.
    # GitHub's own hard maximum for a hosted job is 360.
    # GitHub Actions' own default if this isn't set is 360 minutes (6
    # hours) per job, and NO limit at all on an individual step - which is
    # exactly what let a genuinely stuck thread inside STC API IN.py sit
    # unbounded with nothing stopping it. This is the workflow-level
    # equivalent of the subprocess-kill timeout already built into the
    # local STC Pipeline Runner.py.
    timeout-minutes: 330
    env:
      # Forces Python's stdout to flush immediately on every print(),
      # rather than block-buffering (the default when not attached to a
      # real terminal, exactly GitHub Actions' environment). Without this,
      # the log can appear to freeze at an earlier line than where the
      # script actually is - a genuine hang deeper in the code (inside a
      # thread pool, for instance) can leave print() output sitting in an
      # unflushed buffer, making the log misleading about where things
      # actually stopped.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r infra/requirements.txt

      - name: Decide whether this run is the weekly full pull
        id: groups_check
        run: |
          if [ "${{ github.event.schedule }}" == "0 2 * * 5" ] || [ "${{ github.event.inputs.include_user_groups }}" == "true" ]; then
            echo "include_groups=true" >> "$GITHUB_OUTPUT"
            echo "stage1_timeout=240" >> "$GITHUB_OUTPUT"
            echo "Weekly full pull (HeadsUp, Groups, Sites, Users, User_Groups included) - Stage 1 timeout set to 240 minutes"
          else
            echo "include_groups=false" >> "$GITHUB_OUTPUT"
            echo "stage1_timeout=60" >> "$GITHUB_OUTPUT"
            echo "Daily run - weekly-only endpoints skipped - Stage 1 timeout set to 60 minutes"
          fi

      # ======================================================================
      # STC CORE: TNS -> BNZ -> SLV -> GLD
      # ======================================================================

      - name: Stage 1 - Ingest from SafetyCulture (-> TNS)
        if: github.event.inputs.skip_ingestion_and_transform != 'true'
        working-directory: Scripts
        # Extra per-step cap on top of the job-level one above - this is
        # specifically the step where a stuck thread inside a
        # ThreadPoolExecutor's shutdown has been observed hanging with no
        # further output at all, well past STC API IN.py's own internal
        # future.result() timeouts. Dynamic: 60 min on a normal day, 240 min on
        # the weekly full-pull day. Weekly-only endpoints (slow-changing
        # reference data): HeadsUp_List/Users (about 50 min alone), Groups_List/
        # Users, Sites_List, Site_Members, Users_Feed, User_Groups (2.5+ hours
        # at the current user count), Companies_*. Their TNS files simply stay
        # as last pulled on the other days.
        timeout-minutes: ${{ fromJSON(steps.groups_check.outputs.stage1_timeout) }}
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
          SAFETYCULTURE_API_KEY: ${{ secrets.SAFETYCULTURE_API_KEY }}
          MISSION_ENABLED_OVERRIDES: "${{ steps.groups_check.outputs.include_groups == 'true' && '{}' || '{\"HeadsUp_List\": false, \"HeadsUp_Users\": false, \"Companies_List\": false, \"Companies_Detail\": false, \"Companies_Users\": false, \"Sites_List\": false, \"Site_Members\": false, \"Groups_List\": false, \"Groups_Users\": false, \"Users_Feed\": false, \"User_Groups\": false}' }}"
        run: python "STC API IN.py"

      - name: Stage 2 - Flatten JSON (TNS -> BNZ)
        if: github.event.inputs.skip_ingestion_and_transform != 'true'
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "STC JSON Map and Clean.py"

      - name: Stage 3 - Clean and standardize (BNZ -> SLV)
        if: github.event.inputs.skip_ingestion_and_transform != 'true'
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "STC Data Clean.py"

      - name: Stage 4 - Split date/time columns (in-place on SLV)
        if: github.event.inputs.skip_ingestion_and_transform != 'true'
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "STC Date Scrape.py"

      - name: Stage 5 - Merge tables (SLV -> GLD)
        if: github.event.inputs.skip_ingestion_and_transform != 'true'
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "STC Table Merge.py"

      # ======================================================================
      # RP1: FIRST-PASS REPORTS FROM SLV (-> REP)
      # ======================================================================

      - name: Stage 6 - RP1 ESG Report (SLV -> REP)
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP1 ESG Report.py"

      - name: Stage 7 - RP1 Issues Answers (SLV -> GLD)
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP1 Issues Answers.py"

      # ======================================================================
      # MAP: LABEL/STATUS ENRICHMENT ON GLD (IN PLACE)
      # ======================================================================

      - name: Stage 8 - MAP Status Logic
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "MAP Status Logic.py"

      - name: Stage 9 - MAP Template Labels
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "MAP Template Labels.py"

      - name: Stage 10 - MAP Template QSET Labels
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "MAP Template QSET Labels.py"

      - name: Stage 11 - MAP User Groups
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "MAP User Groups.py"

      # ======================================================================
      # RP2: SECOND-PASS REPORTS (GLD -> REP)
      # ======================================================================

      - name: Stage 12 - RP2 Site Status Pull
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP2 Site Status Pull.py"

      - name: Stage 13 - RP2 Template Label
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP2 Template Label.py"

      - name: Stage 14 - RP2 User Label
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP2 User Label.py"

      - name: Stage 15 - RP2 CM Reports
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP2 CM Reports.py"

      - name: Stage 16 - RP2 Incidents
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP2 Incidents.py"

      - name: Stage 17 - RP2 QSET Reports
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP2 QSET Reports.py"

      - name: Stage 18 - RP2 Site Reports
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP2 Site Reports.py"

      - name: Stage 19 - RP2 HeadsUp
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP2 heads Up.py"

      # ======================================================================
      # RP3: THIRD-PASS REPORTS (REP -> REP; reports built from other reports)
      # ======================================================================

      - name: Stage 20 - RP3 Reporting Logic
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP3 Reporting Logic.py"

      - name: Stage 21 - RP3 Metric List
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP3 Metric List.py"

      - name: Stage 22 - RP3 MCL39
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP3 MCL39.py"

      - name: Stage 23 - RP3 Weekly Incident Report
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP3 Weekly Incident Report.py"

      - name: Stage 24 - RP3 Weekly Performance Report
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP3 Weekly Performance Report.py"

      # ======================================================================
      # RP4: FINAL DELIVERY (GLD/REP -> TABLES, the portal's data source)
      # ======================================================================

      - name: Stage 25 - RP4 Final Output Execution (GLD/REP -> Tables)
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "RP4 GLD to TLB.py"

      - name: Stage 26 - RP4 Site and User Data (-> Tables)
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        # NOTE: this stage reads a monthly staff timesheet that a human has
        # to have dropped into TNS as "*Monthly Staff Timesheet.xlsx"
        # sometime that month (see find_latest_timesheet() in the script) -
        # nothing earlier in this workflow checks that one exists before
        # getting here. If this step fails with "no file matching pattern
        # found", that's why - it's not a bug in the workflow, the upload
        # is a manual step outside this pipeline.
        run: python "RP4 Site and User Data.py"

      - name: Stage 27 - RP2 Samsara User Data (REP)
        # continue-on-error: this report is non-essential - if nobody's
        # dropped a "Tick List Week N.xlsx" into REP/custom reports/driver
        # data/ yet, that's a missing manual upload, not a pipeline bug,
        # and shouldn't fail the whole run.
        continue-on-error: true
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        # Reads REP/rp2_site_user_data.csv (written by Stage 26 just above),
        # plus two manual uploads in REP/custom reports/driver data/:
        # "Tick List Week N.xlsx" (highest week wins) and
        # "Asset Responsible person.xlsx".
        run: python "RP2 Samsara User Data.py"

      - name: Stage 28 - RP4 Waste Data (REP)
        # !cancelled() so this still runs if Stage 26/27 failed (e.g. no
        # monthly timesheet uploaded yet) - it doesn't depend on either.
        # continue-on-error: this report is non-essential - if nobody's
        # dropped this month's "*Scope 3*.xlsx" into TNS/static source
        # files/ yet, that's a missing manual upload, not a pipeline bug,
        # and shouldn't fail the whole run or block Stage 29's publish.
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        # Reads the newest "*Scope 3*.xlsx" in TNS/static source files/ - a
        # manual monthly upload, same as the staff timesheet.
        run: python "RP4 Waste Data.py"


      # ======================================================================
      # PUBLISH: TABLES (Azure) -> SHEQ-Portal repo (assets/tables) -> Netlify
      # ======================================================================

      - name: Stage 29 - Publish tables to the SHEQ Portal repo
        # !cancelled() so tables built by earlier stages still go out even if
        # a later optional stage (e.g. missing monthly upload) failed. If the
        # pipeline broke earlier than the tables, nothing in TABLES/ has
        # changed, so this step finds no diff and pushes nothing.
        if: ${{ !cancelled() }}
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
          PORTAL_PAT: ${{ secrets.PORTAL_PAT }}
        run: |
          if [ -z "$PORTAL_PAT" ]; then
            echo "PORTAL_PAT secret is not set - skipping publish to the portal (see setup notes)."
            exit 0
          fi

          python "Scripts/Publish Tables.py" "$RUNNER_TEMP/tables"

          git clone --depth 1 "https://x-access-token:${PORTAL_PAT}@github.com/Cox0685/SHEQ-Portal.git" "$RUNNER_TEMP/portal"
          mkdir -p "$RUNNER_TEMP/portal/assets/tables"
          cp -f "$RUNNER_TEMP/tables/"* "$RUNNER_TEMP/portal/assets/tables/"

          cd "$RUNNER_TEMP/portal"
          git add assets/tables
          if git diff --cached --quiet; then
            echo "Tables unchanged - nothing to publish."
            exit 0
          fi
          git config user.name "stc-pipeline"
          git config user.email "stc-pipeline@users.noreply.github.com"
          git commit -m "Data refresh $(date -u +%Y-%m-%d) (stc-pipeline)"
          git pull --rebase origin main
          git push origin HEAD:main
