name: Build and Push Image (stopgap - ACR admin credentials)

# This is a temporary path: it uses the Container Registry's admin
# username/password instead of a proper service principal with OIDC
# federated credentials, because setting that up needs an IT admin who
# isn't blocked the way this account currently is. Once that's sorted,
# retire this workflow in favour of the OIDC-based one in deploy.yml and
# turn "Admin user" back OFF on the registry (Access keys blade).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'Scripts/**'

env:
  ACR_LOGIN_SERVER: acrocustcprd001.azurecr.io
  IMAGE_NAME: stc-pipeline

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
