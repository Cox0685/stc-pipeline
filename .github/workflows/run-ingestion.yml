name: Run STC Pipeline (TNS through GLD, scheduled)

# Runs the ingestion + transform chain directly on a GitHub-hosted runner,
# on a schedule - no Azure RBAC/managed identity needed at all. Uses the
# same storage key auth already proven locally, plus the SafetyCulture API
# key, both as GitHub secrets (not baked into the code).
#
# This is a genuine stopgap, not the final architecture: no Log Analytics
# integration, no managed identity, secrets live in GitHub instead of Key
# Vault. It exists to get real automated runs happening today instead of
# waiting on the RBAC grant from IT. Once that comes through, the Container
# App Job (infra/main.bicep) is still the intended long-term home for this -
# migrate back to it then, rather than running two automation paths forever.
#
# SCOPE: covers TNS (raw) -> BNZ -> SLV -> GLD (bronze/silver/gold). The
# reporting stage (REP, via the RP1/RP2/RP3/RP4 scripts) is not yet
# converted to talk to the data lake and is NOT run here.
#
# Steps run in sequence and each depends on the previous one's output -
# GitHub Actions stops the job automatically if any step fails, so a bad
# ingestion run won't silently feed garbage into later stages.

on:
  workflow_dispatch: # manual "Run workflow" button, for testing this before trusting the schedule
  schedule:
    - cron: '0 2 * * *' # daily 02:00 UTC - adjust once you know real run duration

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r infra/requirements.txt

      - name: Stage 1 - Ingest from SafetyCulture (-> TNS)
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
          SAFETYCULTURE_API_KEY: ${{ secrets.SAFETYCULTURE_API_KEY }}
        run: python "STC API IN.py"

      - name: Stage 2 - Flatten JSON (TNS -> BNZ)
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "STC JSON Map and Clean.py"

      - name: Stage 3 - Clean and standardize (BNZ -> SLV)
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "STC Data Clean.py"

      - name: Stage 4 - Merge tables (SLV -> GLD)
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "STC Table Merge.py"

      - name: Stage 5 - Split date/time columns (in-place on SLV)
        working-directory: Scripts
        env:
          ADLS_CONNECTION_STRING: ${{ secrets.ADLS_CONNECTION_STRING }}
          ADLS_FILESYSTEM: stc-data
        run: python "STC Date Scrape.py"
